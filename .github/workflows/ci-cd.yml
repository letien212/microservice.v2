name: Enterprise Microservice CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master

jobs:
  # Giai đoạn 1: CI (Continuous Integration - Build & Test)
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      - name: Build & Install Common Library
        run: |
          cd common-lib/common-lib
          mvn clean install -DskipTests

      - name: Build & Test User Manager Service
        run: |
          cd user-manager
          mvn clean package -DskipTests

  # Giai đoạn 2: CD (Continuous Deployment - Build Docker Image & Push to Docker Hub)
  build-and-push-docker:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & Push User Manager Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./user-manager/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/user-manager:latest
